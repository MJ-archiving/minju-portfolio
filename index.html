<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  수정 방법 (Claude Code에서 "○○ 내용을 이렇게 바꿔줘"라고 요청)  ║

  ║  2. 글자가 "TODO:" 로 시작하면 화면에 점선 박스(✎ 작성 예정)로   ║
  ║     표시됩니다. 실제 내용으로 바꾸면 점선이 사라집니다.          ║
  ║  3. 프로젝트의 draft: true 를 지우면 "초안" 배지가 사라집니다.    ║
  ║  4. 프로젝트/활동을 늘리려면 배열에 { ... } 한 덩어리를 복사해    ║
  ║     붙여 넣으면 됩니다.                                          ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<style>
/* ───────── Design tokens (레퍼런스 3: 컬러 팔레트 / 레퍼런스 1: 네이비 + 블루) ───────── */
:root{
  --navy:#0B1F5C;
  --navy-2:#2C3D8F;
  --blue:#1F4FE0;
  --primary:#5A81FA;
  --sky:#CDDEFF;
  --mist:#F2F5FF;
  --paper:#F8F9FD;
  --ink:#1F1F1F;
  --gray:#6A6F83;
  --gray-2:#A8B1CE;
  --line:#E3E8F6;
  --white:#fff;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --font-en:'Poppins','Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --shadow:0 12px 32px rgba(44,61,143,.10);
  --header-h:64px;
  --wrap:1120px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + 8px);scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.modal-open{overflow:hidden}
body{margin:0;font-family:var(--font);color:var(--ink);background:#fff;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px}
.skip:focus{top:12px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* 작성 예정(TODO) 표시 */
.todo{display:inline-block;padding:0 .55em;border:1px dashed var(--gray-2);border-radius:6px;background:rgba(168,177,206,.14);color:var(--gray);font-weight:400;font-style:normal;line-height:1.55}
.todo::before{content:"✎ "}
.on-dark .todo{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff}
.on-light .todo{border-color:var(--gray-2);background:rgba(168,177,206,.14);color:var(--gray)}

/* ───────── Header / Menu ───────── */
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-in{max-width:var(--wrap);margin:0 auto;height:var(--header-h);padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-en);font-weight:800;font-size:18px;letter-spacing:.03em;color:var(--blue);text-decoration:none}
.logo span{color:var(--navy)}
.nav ul{display:flex;gap:4px}
.nav a{display:block;padding:8px 16px;border-radius:999px;color:var(--gray);font-weight:500;font-size:15px;text-decoration:none}
.nav a:hover{color:var(--blue);background:var(--mist)}
.nav a[aria-current="true"]{background:var(--blue);color:#fff}
.menu-btn{display:none;width:44px;height:44px;border:0;background:transparent;border-radius:12px;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:0}
.menu-btn:hover{background:var(--mist)}
.menu-btn i{display:block;width:22px;height:2px;border-radius:2px;background:var(--navy)}
.menu-btn[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn[aria-expanded="true"] i:nth-child(2){display:none}
.menu-btn[aria-expanded="true"] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ───────── Hero (레퍼런스 1: 네이비 표지 + 항공권) ───────── */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero-in{max-width:var(--wrap);margin:0 auto;padding:36px 24px 96px}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-en);font-size:13px;font-weight:500;letter-spacing:.18em;color:#B9C7F5;text-transform:uppercase}
.globe{width:44px;height:44px;color:#fff}
.wm{position:relative;max-width:900px;margin:56px auto 36px;padding:72px 0 40px}
.flight{position:absolute;inset:0;width:100%;height:100%}
.flight path{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:7 8;vector-effect:non-scaling-stroke;opacity:.85}
.plane-end{position:absolute;left:87%;top:17%;width:clamp(30px,4.5vw,52px);height:clamp(30px,4.5vw,52px);color:#fff;transform:translate(-50%,-50%) rotate(45deg)}
.wordmark{position:relative;display:flex;justify-content:center;align-items:center;font-family:var(--font-en);font-weight:800;font-size:clamp(50px,14.5vw,156px);line-height:1;letter-spacing:-.04em;color:#fff}
.wordmark .w{display:inline-block}
.w1{font-size:1.12em;transform:rotate(-6deg)}
.w-star{width:.78em;height:.78em;margin:0 .02em}
.w-star svg{width:100%;height:100%}
.w3{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;transform:rotate(6deg)}
.w4{transform:rotate(-5deg)}
.w5{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:1.32em;transform:rotate(-8deg);margin:0 .02em 0 -.04em}
.w6{font-size:.95em;transform:rotate(8deg)}
.w7{font-weight:300;font-size:1.2em}
.w8{color:var(--primary);font-size:.92em;transform:rotate(-4deg)}
.w9{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:.92em;transform:rotate(-10deg)}
.hero-copy{text-align:center;margin-bottom:56px}
.hero-hello{font-size:clamp(20px,3vw,28px);font-weight:600;line-height:1.4}
.hero-hello b{color:#9DB8FF}
.hero-tag{margin-top:10px;color:#C7D3F7;font-size:clamp(15px,2vw,18px)}

/* 항공권(티켓) 컴포넌트 */
.ticket{--notch:var(--navy);display:grid;grid-template-columns:240px 1fr;max-width:980px;margin:0 auto;background:#fff;color:var(--ink);border-radius:28px;position:relative}
.ticket-stub{position:relative;background:var(--blue);color:#fff;border-radius:28px 0 0 28px;padding:28px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:260px}
.ticket-stub::before,.ticket-stub::after{content:"";position:absolute;right:-14px;width:28px;height:28px;border-radius:50%;background:var(--notch);z-index:2}
.ticket-stub::before{top:-14px}
.ticket-stub::after{bottom:-14px}
.stub-label{font-family:var(--font-en);font-size:12px;font-weight:600;letter-spacing:.2em;opacity:.85}
.stub-name{font-family:var(--font-en);font-weight:800;font-size:26px;line-height:1.15;letter-spacing:.01em;margin-top:6px}
.stub-plane{width:34px;height:34px;transform:rotate(45deg)}
.barcode{width:100%;height:46px;color:currentColor}
.ticket-main{padding:30px 36px 32px;border-left:2px dashed var(--sky);min-width:0}
.ticket-head{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--blue)}
.ticket-head .plane{width:30px;height:30px;transform:rotate(45deg)}
.ticket-head strong{font-family:var(--font-en);font-weight:700;font-size:17px;letter-spacing:.04em;color:var(--blue)}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-top:22px}
.route dt{font-family:var(--font-en);font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--blue)}
.route dd{font-size:clamp(17px,2.2vw,22px);font-weight:700;color:var(--navy);line-height:1.35;margin-top:2px}
.route dd small{display:block;font-size:14px;font-weight:500;color:var(--gray)}
.route-arrow{color:var(--gray-2);width:28px;height:28px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;background:var(--mist);color:var(--navy-2);font-size:14px;font-weight:600}
.chip em{font-style:normal;font-family:var(--font-en);font-size:11px;letter-spacing:.12em;color:var(--primary)}
.toc{margin-top:24px;border-top:1px solid var(--line)}
.toc a{display:flex;align-items:baseline;gap:14px;padding:11px 4px;border-bottom:1px dotted var(--gray-2);text-decoration:none;color:var(--navy)}
.toc a:hover{background:var(--mist)}
.toc .no{font-family:var(--font-en);font-weight:700;font-size:13px;color:var(--blue);min-width:22px}
.toc .lb{font-weight:600}
.toc .en{margin-left:auto;font-family:var(--font-en);font-size:13px;color:var(--gray)}

/* ───────── Sections ───────── */
.sec{padding:104px 0}
.sec-paper{background:var(--paper)}
.sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:56px}
.eyebrow{font-family:var(--font-en);font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--gray);text-transform:uppercase}
.sec h2{font-size:clamp(30px,4vw,42px);line-height:1.25;color:var(--navy);margin-top:6px;font-weight:800}
.lens{width:48px;height:34px;color:var(--gray-2);flex:none;margin-top:6px}
.sub{font-family:var(--font-en);font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--blue);text-transform:uppercase;margin-bottom:14px}

/* About */
.about{display:grid;grid-template-columns:clamp(200px,20vw,260px) minmax(0,1fr) clamp(270px,28vw,340px);grid-template-areas:"profile text scene";gap:40px;align-items:start}
.profile-wrap{grid-area:profile}
.about-text{grid-area:text;min-width:0}
.profile-img{aspect-ratio:1/1;border-radius:24px;background:var(--blue);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.profile-img img{width:100%;height:100%;object-fit:cover}
.info{display:grid;gap:10px}
.has-photo .info{margin-top:28px}
.info div{display:grid;grid-template-columns:minmax(0,1fr);gap:0;font-size:15px}
.info dt{font-family:var(--font-en);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
.info dd{font-weight:500;overflow-wrap:anywhere}
.quote{font-size:clamp(22px,3vw,30px);font-weight:700;line-height:1.45;color:var(--navy);margin-bottom:28px}
.quote::before{content:"“";color:var(--primary);margin-right:4px}
.quote::after{content:"”";color:var(--primary);margin-left:2px}
.about-text p{font-size:17px;color:#33384A}
.about-text p + p{margin-top:16px}
.about-text p.sub,.about-text p.quote{color:inherit}
.about-text p.sub{color:var(--blue);font-size:14px}
.about-text p.quote{color:var(--navy);font-size:clamp(20px,2.4vw,28px)}
.keywords{margin-top:44px}

/* 데이터 작업실 일러스트 (소개 옆) */
/* .scene 카드: overflow:hidden 으로 그림이 움직여도 화면 밖으로 넘치지 않게 합니다.
   위쪽 여백(36px)은 스크롤·떠오름·마우스 이동으로 그림이 위로 올라갈 공간입니다. */
.scene{grid-area:scene;margin:0;min-width:0;overflow:hidden;background:radial-gradient(circle at 50% 38%,#fff 0,var(--mist) 72%);border-radius:28px;padding:36px 18px 22px}
/* .scene-motion: 움직이는 요소 (JS가 transform 을 바꿉니다: 떠오름 + 마우스 + 스크롤) */
.scene-motion{display:block;transform-origin:50% 70%;will-change:transform}
.scene-img{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 16px rgba(44,61,143,.18))}
.scene-tools{display:flex;justify-content:flex-end;margin-top:14px}
.motion-toggle{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--primary);background:#fff;color:var(--blue);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;min-height:36px}
.motion-toggle:hover{background:var(--mist)}
.scene-credit{margin-top:14px;font-size:12px;color:var(--gray)}
.scene figcaption{padding:14px 8px 0}
.scene figcaption .sub{margin-bottom:4px}
.scene-title{font-size:18px;font-weight:700;color:var(--navy);line-height:1.4}
.scene-cap{margin-top:4px;font-size:14px;color:var(--gray);line-height:1.6}
.scene-points{margin-top:16px;display:grid;gap:12px}
.scene-points li{display:grid;grid-template-columns:12px 1fr;gap:10px;font-size:13.5px;line-height:1.55;color:#3B4156}
.scene-points li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c,#A8B1CE);border:2px solid #3B2F33;margin-top:4px}
.scene-points strong{display:block;color:var(--navy);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pill{padding:8px 22px;border-radius:999px;border:1.5px solid var(--primary);color:var(--blue);font-family:var(--font-en);font-weight:500;font-size:15px;background:#fff}

/* Projects */
.projects{--notch:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{position:relative;background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card:hover{box-shadow:0 14px 36px rgba(31,79,224,.22)}
.card-art{position:relative;padding:22px 24px 26px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:var(--blue)}
.card-art::before,.card-art::after{content:"";position:absolute;bottom:-12px;width:24px;height:24px;border-radius:50%;background:var(--notch);z-index:2}
.card-art::before{left:-12px}
.card-art::after{right:-12px}
.t-blue{background:var(--blue);color:#fff}
.t-navy{background:var(--navy);color:#fff}
.t-sky{background:var(--sky);color:var(--navy)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-no{font-family:var(--font-en);font-weight:800;font-size:54px;line-height:1;letter-spacing:-.02em}
.card-cat{font-size:13px;font-weight:600;letter-spacing:.02em;opacity:.92;text-align:right}
.card-art .barcode{width:120px;height:26px;opacity:.85}
.card-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:20px}
.card-art .plane{width:26px;height:26px;transform:rotate(45deg)}
.card-body{padding:30px 26px 26px;display:flex;flex-direction:column;flex:1}
.card-body h3{font-size:20px;line-height:1.4;color:var(--navy);font-weight:700}
.card-body p{margin-top:10px;font-size:15px;color:var(--gray)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 22px}
.tags li{font-size:13px;color:var(--navy-2);background:var(--mist);padding:3px 12px;border-radius:999px;font-weight:500}
.card-btn{margin-top:auto;align-self:flex-start;padding:0;border:0;background:transparent;color:var(--blue);font-weight:700;font-size:15px}
.card-btn::after{content:"";position:absolute;inset:0}
.card-btn:hover{text-decoration:underline}
.badge-draft{display:inline-block;font-family:var(--font-en);font-size:11px;font-weight:600;letter-spacing:.1em;padding:2px 10px;border-radius:999px;border:1px solid currentColor;opacity:.9;align-self:flex-start;line-height:1.6}
.card-body .badge-draft{color:var(--gray);margin-bottom:10px;border-color:var(--gray-2)}

/* Skills (레퍼런스 3: 컴포넌트 카드) */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.skill{background:var(--mist);border-radius:24px;padding:32px}
.skill-ic{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.skill-ic svg{width:24px;height:24px}
.skill h3{font-size:20px;color:var(--navy);margin-top:20px;font-weight:700}
.skill p{margin-top:8px;color:var(--gray);font-size:15px}
.skill .pills{margin-top:20px;gap:8px}
.skill .pill{padding:4px 16px;font-size:14px;font-family:var(--font)}
.tools{margin-top:48px}
.tools .pill{padding:6px 20px;font-size:14px}

/* Activity (레퍼런스 1: Resume 영역) */
.rec{display:grid;grid-template-columns:1.55fr 1fr;gap:64px;align-items:start}
.exp-list{display:grid;gap:14px}
.exp{background:#fff;border-radius:20px;box-shadow:var(--shadow)}
.exp summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:116px 1fr 28px;gap:16px;align-items:center;padding:22px 26px;border-radius:20px}
.exp summary::-webkit-details-marker{display:none}
.exp summary::after{content:"+";font-family:var(--font-en);font-size:24px;font-weight:500;color:var(--blue);text-align:center;line-height:1}
.exp[open] summary::after{content:"–"}
.exp summary:hover{background:var(--mist)}
.exp-period{font-family:var(--font-en);font-weight:700;font-size:14px;color:var(--navy)}
.exp-type{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:var(--mist);padding:1px 10px;border-radius:999px;margin-right:8px;vertical-align:2px}
.exp-title{font-weight:700;font-size:17px;color:var(--navy)}
.exp-org{display:block;font-size:14px;color:var(--gray)}
.exp-body{padding:2px 26px 26px 158px}
.exp-body p{font-size:15px;color:#3B4156}
.exp-body ul{margin-top:12px;display:grid;gap:6px}
.exp-body li{font-size:15px;color:#3B4156;padding-left:16px;position:relative}
.exp-body li::before{content:"";position:absolute;left:0;top:.78em;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.link-btn{margin-top:18px;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;color:var(--blue);font-weight:700;font-size:15px}
.link-btn:hover{text-decoration:underline}
.exp-placeholder{border:2px dashed var(--gray-2);border-radius:20px;padding:22px 26px;color:var(--gray);display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center;font-size:15px}
.side-block + .side-block{margin-top:44px}
.rows li{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows .d{font-family:var(--font-en);font-weight:700;font-size:13px;color:var(--navy);padding-top:2px}
.rows strong{display:block;color:var(--navy);font-weight:700}
.rows span.o{color:var(--gray);font-size:14px}

/* Contact */
.sec-navy{background:var(--navy);color:#fff;padding-bottom:0}
.sec-navy h2{color:#fff}
.sec-navy .eyebrow{color:#9DB0EE}
.sec-navy .lens{color:#6F85CF}
.contact-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:64px;align-items:center}
.contact-big{font-family:var(--font-en);font-weight:800;font-size:clamp(44px,8vw,92px);line-height:1;letter-spacing:-.03em;color:var(--primary);margin-bottom:24px}
.contact-copy p.lead{font-size:18px;color:#D3DDFA}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:700;font-size:16px;border:2px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;min-height:50px}
.btn:hover{background:var(--navy-2);border-color:var(--navy-2)}
.on-dark .btn{background:#fff;border-color:#fff;color:var(--navy)}
.on-dark .btn:hover{background:var(--sky);border-color:var(--sky)}
.on-dark .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.65)}
.on-dark .btn.ghost:hover{background:rgba(255,255,255,.12)}
.ticket.contact-ticket{grid-template-columns:1fr;max-width:none;margin:0}
.contact-ticket .ticket-main{border-left:0;padding:32px 36px}
.contact-list{margin-top:24px;border-top:1px solid var(--line)}
.contact-list div{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:14px 0;border-bottom:1px dotted var(--gray-2);align-items:baseline}
.contact-list dt{font-family:var(--font-en);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
.contact-list dd{font-weight:600;color:var(--navy);overflow-wrap:anywhere}
.contact-list a{color:var(--navy)}
.contact-list a:hover{color:var(--blue)}
.contact-ticket .barcode{height:42px;margin-top:26px;color:var(--blue)}
.copy-status{min-height:1.6em;margin-top:12px;font-size:14px;color:#9DB8FF}
.footer{margin-top:88px;padding:26px 0 34px;border-top:1px solid rgba(255,255,255,.18);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:#9DB0EE;font-family:var(--font-en)}

/* ───────── Detail dialog (레퍼런스 2: 케이스 스터디) ───────── */
dialog.detail{border:0;padding:0;margin:auto;width:min(1000px,calc(100% - 48px));max-width:none;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);border-radius:28px;background:#fff;color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.detail::backdrop{background:rgba(11,31,92,.74)}
.d-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px 12px 28px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.d-count{font-family:var(--font-en);font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--gray)}
.d-close{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--mist);color:var(--navy);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;min-height:42px}
.d-close:hover{background:var(--sky)}
.d-hero{--line2:rgba(255,255,255,.45);position:relative;padding:44px 40px 38px;background:var(--blue);color:#fff}
.d-hero.t-navy{background:var(--navy)}
.d-hero.t-sky{background:var(--sky);color:var(--navy);--line2:rgba(11,31,92,.35)}
.d-hero .cat{font-size:14px;font-weight:700;letter-spacing:.04em;opacity:.92;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-hero h2{color:inherit;font-size:clamp(26px,4.2vw,42px);line-height:1.28;margin:14px 0 14px;font-weight:800}
.d-hero .lead{font-size:clamp(16px,2vw,19px);opacity:.94;max-width:720px}
.d-hero .big-no{position:absolute;right:32px;top:22px;font-family:var(--font-en);font-weight:800;font-size:clamp(60px,12vw,140px);line-height:1;opacity:.14}
.d-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:32px;padding-top:22px;border-top:1px dashed var(--line2)}
.d-meta dt{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.75}
.d-meta dd{margin-top:2px;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.d-body{padding:12px 40px 36px}
.d-sec{padding:36px 0;border-bottom:1px solid var(--line)}
.d-sec:last-of-type{border-bottom:0}
.d-sec .eyebrow{color:var(--blue)}
.d-sec h3{font-size:clamp(21px,2.6vw,27px);line-height:1.35;color:var(--navy);margin:4px 0 16px;font-weight:800}
.d-sec p.txt{font-size:17px;color:#33384A}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{background:var(--mist);border-radius:20px;padding:22px 22px 24px;font-size:15px;color:#33384A}
.pcard .n{display:block;font-family:var(--font-en);font-weight:800;font-size:22px;color:var(--blue);margin-bottom:6px}
.steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.steps::before{content:"";position:absolute;top:21px;left:22px;right:22px;border-top:2px dashed var(--sky)}
.steps li{position:relative}
.steps .c{position:relative;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--font-en);font-weight:700;display:flex;align-items:center;justify-content:center}
.steps h4{margin-top:14px;font-size:17px;color:var(--navy);font-weight:700}
.steps p{margin-top:6px;font-size:14.5px;color:var(--gray)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}
.stat b{display:block;font-family:var(--font-en);font-weight:800;font-size:clamp(22px,3vw,32px);line-height:1.3;color:var(--blue)}
.stat span.l{display:block;margin-top:6px;font-size:14px;color:var(--gray)}
.learned{border-left:4px solid var(--blue);background:var(--mist);border-radius:0 20px 20px 0;padding:22px 26px;font-size:17px;color:var(--navy);font-weight:500}
.d-links{display:flex;flex-wrap:wrap;gap:10px}
.d-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:24px 40px 40px;background:var(--paper);border-top:1px solid var(--line)}
.d-nav button{display:block;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px 20px}
.d-nav button:hover{border-color:var(--primary);background:var(--mist)}
.d-nav button.next{text-align:right}
.d-nav small{display:block;font-family:var(--font-en);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--blue)}
.d-nav strong{display:block;margin-top:2px;color:var(--navy);font-size:15px;line-height:1.4}

/* ───────── Responsive ───────── */
@media (max-width:1000px){
  .projects{grid-template-columns:1fr 1fr}
  .about{grid-template-columns:240px minmax(0,1fr);grid-template-areas:"profile text" "profile scene";gap:40px}
  .rec{grid-template-columns:1fr;gap:56px}
  .contact-grid{grid-template-columns:1fr;gap:48px}
  .d-meta{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .steps::before{display:none}
}
@media (max-width:860px){
  .menu-btn{display:inline-flex}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px 20px;box-shadow:0 18px 30px rgba(11,31,92,.12)}
  .nav.open{display:block}
  .nav ul{flex-direction:column;gap:2px}
  .nav a{padding:14px 16px;font-size:17px;border-radius:14px}
  .ticket{grid-template-columns:1fr}
  .ticket-stub{border-radius:28px 28px 0 0;min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap;padding:22px 26px}
  .ticket-stub::before,.ticket-stub::after{right:auto;top:auto;bottom:-14px}
  .ticket-stub::before{left:-14px}
  .ticket-stub::after{right:-14px}
  .ticket-stub .barcode{width:140px;height:36px;margin-left:auto}
  .ticket-main{border-left:0;border-top:2px dashed var(--sky);padding:28px 24px}
}
@media (max-width:720px){
  .sec{padding:72px 0}
  .sec-head{margin-bottom:36px}
  .wrap,.header-in,.hero-in{padding-left:20px;padding-right:20px}
  .hero-in{padding-top:24px;padding-bottom:64px}
  .wm{margin:36px auto 24px;padding:56px 0 28px}
  .about{grid-template-columns:minmax(0,1fr);grid-template-areas:"profile" "text" "scene";gap:36px}
  .scene{width:100%;max-width:520px;justify-self:center}
  .profile-wrap.has-photo{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center}
  .profile-img{border-radius:20px}
  .has-photo .info{margin-top:0}
  .scene{padding:30px 14px 20px}
  .projects{grid-template-columns:1fr}
  .skills{grid-template-columns:1fr}
  .skill{padding:26px}
  .exp summary{grid-template-columns:1fr 28px;gap:6px 12px;padding:18px 20px}
  .exp-period{grid-column:1/-1}
  .exp-body{padding:0 20px 22px}
  .exp-placeholder{grid-template-columns:1fr;gap:4px;padding:18px 20px}
  .rows li{grid-template-columns:96px 1fr}
  .route{grid-template-columns:1fr;gap:4px}
  .route-arrow{transform:rotate(90deg);margin:2px 0}
  .contact-ticket .ticket-main{padding:26px 22px}
  .contact-list div{grid-template-columns:70px 1fr}
  .footer{margin-top:64px}
  /* 상세 보기: 모바일은 전체 화면 */
  dialog.detail{width:100%;height:100%;max-height:100%;border-radius:0}
  .d-bar{padding-left:20px}
  .d-hero{padding:32px 20px 28px}
  .d-hero .big-no{right:16px;top:12px}
  .d-body{padding:4px 20px 28px}
  .d-sec{padding:28px 0}
  .cards3,.stats{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;gap:22px}
  .steps::before{display:block;top:22px;bottom:22px;left:21px;right:auto;border-top:0;border-left:2px dashed var(--sky)}
  .steps li{display:grid;grid-template-columns:44px 1fr;gap:0 16px}
  .steps li .c{grid-row:1/3}
  .steps h4{margin-top:8px}
  .d-nav{grid-template-columns:1fr;padding:20px 20px 32px}
  .d-nav button.next{text-align:left}
}
@media (max-width:420px){
  .profile-wrap.has-photo{grid-template-columns:1fr}
  .profile-img{max-width:200px}
  .d-meta{grid-template-columns:1fr 1fr;gap:14px}
}
</style>
</head>
<body>

<a class="skip" href="#about">본문 바로가기</a>

<!-- 아이콘 모음 (화면에는 보이지 않음) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-plane" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12h15M13 6l6 6-6 6"/></symbol>

</svg>

<header class="site-header">
  <div class="header-in">
    <a class="logo" href="#top" aria-label="맨 위로"><span data-bind="profile.initials"></span> <span data-bind="profile.nameEn"></span></a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="메뉴 열기"><i></i><i></i><i></i></button>
    <nav class="nav" id="nav" aria-label="주 메뉴">
      <ul>
        <li><a href="#about">소개</a></li>
        <li><a href="#projects">프로젝트</a></li>
        <li><a href="#skills">역량</a></li>
        <li><a href="#activity">활동 기록</a></li>
        <li><a href="#contact">연락처</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <noscript><p style="padding:40px;text-align:center">이 포트폴리오를 보려면 JavaScript를 켜 주세요.</p></noscript>

  <!-- ───────── HERO ───────── -->
  <section class="hero on-dark" id="top" aria-labelledby="hero-title">
    <div class="hero-in">
      <div class="hero-top">
        <span id="hero-label"></span>
        <svg class="globe" aria-hidden="true"><use href="#i-globe"/></svg>
      </div>

      <h1 class="sr-only" id="hero-title"><span data-bind="profile.nameKo"></span> 포트폴리오</h1>
      <div class="wm" aria-hidden="true">
        <svg class="flight" viewBox="0 0 1000 320" preserveAspectRatio="none"><path d="M70 300 C 20 120, 170 30, 470 28 S 800 10, 870 58"/></svg>
        <svg class="plane-end"><use href="#i-plane"/></svg>
        <div class="wordmark">
          <span class="w w1">P</span><span class="w w-star" data-star></span><span class="w w3">r</span><span class="w w4">t</span><span class="w w5">f</span><span class="w w6">o</span><span class="w w7">l</span><span class="w w8">i</span><span class="w w9">o</span>
        </div>
      </div>

      <div class="hero-copy" id="hero-copy"></div>
      <div id="hero-ticket"></div>
    </div>
  </section>

  <!-- ───────── 소개 ───────── -->
  <section class="sec on-light" id="about" aria-labelledby="about-h">
    <div class="wrap">
      <header class="sec-head">
        <div><p class="eyebrow">Cover Letter</p><h2 id="about-h">소개</h2></div>
        <svg class="lens" aria-hidden="true"><use href="#i-lens"/></svg>
      </header>
      <div class="about" id="about-body"></div>
    </div>
  </section>

  <!-- ───────── 프로젝트 ───────── -->
  <section class="sec sec-paper on-light" id="projects" aria-labelledby="projects-h">
    <div class="wrap">
      <header class="sec-head">
        <div><p class="eyebrow">Selected Works</p><h2 id="projects-h">프로젝트</h2></div>
        <svg class="lens" aria-hidden="true"><use href="#i-lens"/></svg>
      </header>
      <div class="projects" id="project-list"></div>
    </div>
  </section>

  <!-- ───────── 역량 ───────── -->
  <section class="sec on-light" id="skills" aria-labelledby="skills-h">
    <div class="wrap">
      <header class="sec-head">
        <div><p class="eyebrow">Skills</p><h2 id="skills-h">역량</h2></div>
        <svg class="lens" aria-hidden="true"><use href="#i-lens"/></svg>
      </header>
      <div id="skills-body"></div>
    </div>
  </section>

  <!-- ───────── 활동 기록 ───────── -->
  <section class="sec sec-paper on-light" id="activity" aria-labelledby="activity-h">

      <header class="sec-head">
        <div><p class="eyebrow">Resume</p><h2 id="activity-h">활동 기록</h2></div>
        <svg class="lens" aria-hidden="true"><use href="#i-lens"/></svg>
      </header>
      <div class="rec" id="activity-body"></div>

  <!-- ───────── 연락처 ───────── -->
  <section class="sec sec-navy on-dark" id="contact" aria-labelledby="contact-h">

      <header class="sec-head">
        <div><p class="eyebrow">Contact</p><h2 id="contact-h">연락처</h2></div>

<!-- 프로젝트 상세 보기 -->
<dialog class="detail" id="detail" aria-labelledby="detail-title"></dialog>

<!-- 소개 옆 일러스트: 직접 그린 오리지널 인라인 SVG입니다(외부 이미지·로고·실제 사진 없음, 파일 하나로 완결).
     다른 그림으로 바꾸려면 <template> 안의 내용을 <img class="scene-img" src="assets/scene.webp" alt="..."> 로 바꾸면 됩니다.
     화면에서는 소개 섹션의 .scene-motion 요소 안으로 들어갑니다. -->
<template id="scene-tpl">
<svg class="scene-img" viewBox="0 0 720 543" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="노트북 앞에서 눈썹을 모으고 집중해 일하는 둥근 흰색 캐릭터 일러스트">
  <defs>
    <linearGradient id="sv-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".62" stop-color="#F7F9FE"/><stop offset="1" stop-color="#DFE7F8"/></linearGradient>
    <radialGradient id="sv-gloss" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="sv-blush" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF8FAE" stop-opacity=".85"/><stop offset="1" stop-color="#FF8FAE" stop-opacity="0"/></radialGradient>
    <linearGradient id="sv-lid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDDFE4"/><stop offset="1" stop-color="#BCC0C8"/></linearGradient>
    <linearGradient id="sv-deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6D9DF"/><stop offset="1" stop-color="#B4B8C1"/></linearGradient>
    <linearGradient id="sv-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF3E0"/><stop offset="1" stop-color="#F1E3C4"/></linearGradient>
    <linearGradient id="sv-desk-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBD9B3"/><stop offset="1" stop-color="#DDC297"/></linearGradient>
    <linearGradient id="sv-chair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#85888F"/><stop offset="1" stop-color="#5A5D64"/></linearGradient>
    <linearGradient id="sv-box" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFE"/><stop offset="1" stop-color="#DCE5F5"/></linearGradient>
    <linearGradient id="sv-box-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF2FB"/></linearGradient>
    <linearGradient id="sv-box-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CBD8EE"/><stop offset="1" stop-color="#B3C5E4"/></linearGradient>
    <linearGradient id="sv-cat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FADCA8"/><stop offset="1" stop-color="#EDB671"/></linearGradient>

<script>

  'use strict';

  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  /* ── 유틸 ── */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isTodo = s => typeof s === 'string' && /^TODO/.test(s);
  const tx = s => isTodo(s) ? '<span class="todo">' + (esc(s.replace(/^TODO:?\s*/, '')) || '작성 예정') + '</span>' : esc(s);
  const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const icon = (id, cls) => '<svg class="' + (cls || '') + '" aria-hidden="true"><use href="#i-' + id + '"/></svg>';

  /* 바코드 / 별 모양 장식 생성 */
  function barcode(seed, w, h) {
    w = w || 160; h = h || 40;
    let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    let x = 0, out = '';
    while (x < w) {
      const bw = 1 + Math.floor(rnd() * 3), gap = 1 + Math.floor(rnd() * 3);
      if (x + bw > w) break;
      out += '<rect x="' + x + '" y="0" width="' + bw + '" height="' + h + '"/>';
      x += bw + gap;
    }
    return '<svg class="barcode" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true" fill="currentColor">' + out + '</svg>';
  }
  function starSVG() {
    const n = 12, R = 50, r = 33, pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = Math.PI * i / n - Math.PI / 2, rad = i % 2 ? r : R;
      pts.push((Math.cos(a) * rad).toFixed(1) + ',' + (Math.sin(a) * rad).toFixed(1));
    }
    return '<svg viewBox="-52 -52 104 104" aria-hidden="true"><polygon points="' + pts.join(' ') + '" fill="#fff"/><circle r="11" fill="#0B1F5C"/></svg>';
  }

  const SECTIONS = [

  /* ── 소개 옆 일러스트 움직임 (.scene-motion) ──
     · 7초 주기로 위아래 5px 떠오름 (rAF 시간 값 기반)
     · PC(마우스)에서만 마우스를 따라 조금 이동, 기울기 최대 4도
     · 스크롤하면 위로 최대 20px
     · 움직임 멈춤 버튼 / prefers-reduced-motion(기본 꺼짐) / 숨겨진 탭·화면 밖에서는 정지 */
  (function sceneMotion() {
    const el = $('.scene-motion'), card = $('.scene'), btn = $('#motion-toggle');
    if (!el || !card || !btn) return;

    const FLOAT_AMP = 5, FLOAT_PERIOD = 7000;          // px, ms
    const POINTER_X = 8, POINTER_Y = 6, TILT_MAX = 4;   // px, px, deg
    const SCROLL_MAX = 20;                              // px (위쪽)
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const listen = (mq, fn) => (mq.addEventListener ? mq.addEventListener('change', fn) : mq.addListener(fn));
    const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
    const fineMQ = window.matchMedia('(hover: hover) and (pointer: fine)');

    let on = !reduceMQ.matches;     // 움직임 켜짐 여부 (시스템에서 움직임 줄이기를 켰다면 처음엔 꺼짐)
    let rafId = 0, last = 0, clock = 0, inView = true;
    const cur = { x: 0, y: 0, rx: 0, ry: 0, scroll: 0, f: 0 };   // 현재 값 (부드럽게 따라감)
    const tgt = { x: 0, y: 0, rx: 0, ry: 0 };                    // 마우스 목표 값

    function paintBtn() {
      btn.textContent = on ? '⏸ 움직임 멈춤' : '▶ 움직임 재생';
      btn.setAttribute('aria-label', on ? '그림 움직임 멈춤' : '그림 움직임 재생');
    }
    function settled() {
      return Math.abs(cur.f) < 0.002 && Math.abs(cur.scroll) < 0.05 && Math.abs(cur.x) < 0.05 && Math.abs(cur.y) < 0.05 &&
             Math.abs(cur.rx) < 0.02 && Math.abs(cur.ry) < 0.02;
    }
    function resetTarget() { tgt.x = tgt.y = tgt.rx = tgt.ry = 0; }

    function frame(ts) {
      rafId = requestAnimationFrame(frame);
      if (!last) last = ts;
      const dt = Math.min(64, ts - last); last = ts;   // 탭 복귀 등으로 시간이 크게 튀는 것을 막음
      if (on) clock += dt;                              // 멈춤 중에는 시계도 멈춤 → 다시 켜면 이어서 움직임
      const k = tau => 1 - Math.exp(-dt / tau);         // 프레임 속도와 상관없는 부드러운 따라가기

      // 스크롤: 카드가 화면 아래에서 들어와 위로 나갈 때 0 → 1
      const r = card.getBoundingClientRect(), vh = window.innerHeight || document.documentElement.clientHeight;
      const p = clamp((vh - r.top) / (vh + r.height), 0, 1);

      cur.f      += ((on ? 1 : 0) - cur.f) * k(450);
      cur.scroll += ((on ? -SCROLL_MAX * p : 0) - cur.scroll) * k(260);
      cur.x      += (tgt.x  - cur.x)  * k(170);
      cur.y      += (tgt.y  - cur.y)  * k(170);
      cur.rx     += (tgt.rx - cur.rx) * k(200);
      cur.ry     += (tgt.ry - cur.ry) * k(200);

      const bob = Math.sin(2 * Math.PI * clock / FLOAT_PERIOD) * FLOAT_AMP * cur.f;
      el.style.transform = 'translate3d(' + cur.x.toFixed(2) + 'px,' + (cur.y + bob + cur.scroll).toFixed(2) + 'px,0) ' +
        'perspective(900px) rotateX(' + cur.rx.toFixed(3) + 'deg) rotateY(' + cur.ry.toFixed(3) + 'deg)';

      if (!on && settled()) { el.style.transform = ''; stop(); }   // 멈춤 상태로 다 가라앉으면 루프 종료
    }
    function start() { if (!rafId && !document.hidden && inView) { last = 0; rafId = requestAnimationFrame(frame); } }
    function stop()  { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }

    /* 마우스 따라가기: 마우스가 있는 PC에서만 (터치 기기에서는 리스너 자체를 달지 않음) */
    function onMove(e) {
      if (!on || e.pointerType !== 'mouse') return;
      const nx = clamp(e.clientX / window.innerWidth * 2 - 1, -1, 1), ny = clamp(e.clientY / window.innerHeight * 2 - 1, -1, 1);
      let ry = nx * TILT_MAX, rx = -ny * TILT_MAX;
      const m = Math.hypot(rx, ry); if (m > TILT_MAX) { rx *= TILT_MAX / m; ry *= TILT_MAX / m; }   // 기울기 최대 4도
      tgt.x = nx * POINTER_X; tgt.y = ny * POINTER_Y; tgt.rx = rx; tgt.ry = ry;
    }
    let bound = false;
    function bindPointer() {
      if (fineMQ.matches && !bound) {
        window.addEventListener('pointermove', onMove, { passive: true });
        document.documentElement.addEventListener('mouseleave', resetTarget);
        window.addEventListener('blur', resetTarget);
        bound = true;
      } else if (!fineMQ.matches && bound) {
        window.removeEventListener('pointermove', onMove);
        document.documentElement.removeEventListener('mouseleave', resetTarget);
        window.removeEventListener('blur', resetTarget);
        resetTarget(); bound = false;
      }
    }

    btn.addEventListener('click', () => { on = !on; if (!on) resetTarget(); paintBtn(); start(); });
    listen(reduceMQ, () => { on = !reduceMQ.matches; if (!on) resetTarget(); paintBtn(); start(); });
    listen(fineMQ, bindPointer);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });   // 숨겨진 탭에서는 정지
    if ('IntersectionObserver' in window) {                                                                   // 화면 밖에서는 정지
      new IntersectionObserver(es => { inView = es[0].isIntersecting; if (inView) start(); else stop(); }, { rootMargin: '80px 0px' }).observe(card);
    }

    bindPointer(); paintBtn(); start();
  })();

      else { history.pushState(null, '', url); pushed = true; }
    }
    const c = $('.d-close', dlg); if (c) c.focus();
    dlg.scrollTop = 0;
  }

  dlg.addEventListener('close', () => {
    document.documentElement.classList.remove('modal-open');
    if (/^#project-/.test(location.hash)) {
      if (pushed) { pushed = false; history.back(); }
      else history.replaceState(null, '', location.pathname + location.search + '#projects');
    }
  });
  dlg.addEventListener('click', e => {
    if (e.target === dlg || e.target.closest('[data-close]')) { dlg.close(); return; }
    const o = e.target.closest('[data-open]'); if (o) openProject(o.dataset.open);
  });
  document.addEventListener('click', e => {
    const o = e.target.closest('[data-open]');
    if (o && !dlg.contains(o)) openProject(o.dataset.open);
  });

  function syncFromHash() {
    const m = location.hash.match(/^#project-(.+)$/);
    if (m && idxOf(m[1]) >= 0) openProject(m[1], { fromHash: true });
    else if (dlg.open) { pushed = false; dlg.close(); }
  }
  window.addEventListener('popstate', syncFromHash);
  syncFromHash();
})();
</script>
</body>
</html>
